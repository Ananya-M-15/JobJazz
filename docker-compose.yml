services:
  db:
    image: postgres:17
    container_name: jobjazz-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobjazz
    ports:
      - "5432:5432"
    volumes:
      - jobjazz_postgres_data:/var/lib/postgresql/data

volumes:
  jobjazz_postgres_data: